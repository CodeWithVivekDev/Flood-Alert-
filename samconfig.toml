version = 0.1

[default]
[default.global.parameters]
stack_name = "flood-alert-stack"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = true
region = "ap-south-1"
parameter_overrides = [
  "Environment=\"dev\"",
  "CallProvider=\"mock\"",
  "TestAllowlistPhones=\"+919876543210\""
]

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
port = 8000
host = "127.0.0.1"
